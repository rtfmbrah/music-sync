state_directory = "/srv/music-sync-state"
library_directory = "/srv/music"
playlist_directory = "/srv/music/_playlists"

[concurrency]
provider_requests = 2
downloads = 1
metadata_requests = 4

[discovery]
enabled = false
target_new_tracks_per_day = 8
max_new_tracks_per_day = 15
max_tracks_per_artist_per_day = 2
exploration_ratio = 0.20
wildcard_ratio = 0.05
minimum_free_disk_gb = 20
# listenbrainz_user = "your-public-listenbrainz-user"
# navidrome_url = "https://music.example.invalid"
# navidrome_user = "music-sync-readonly"

[service]
enabled = false
# user_agent = "music-sync/0.1 (operator@example.invalid)"
yt_dlp = "/opt/music-sync/current/yt-dlp"
# yt_dlp_cookie_file = "/etc/music-sync/youtube-cookies.txt"
yt_dlp_sleep_requests_seconds = 1
yt_dlp_min_sleep_seconds = 5
yt_dlp_max_sleep_seconds = 15
ffprobe = "/usr/bin/ffprobe"
ffmpeg = "/usr/bin/ffmpeg"
fpcalc = "/usr/bin/fpcalc"
musicbrainz_endpoint = "https://musicbrainz.org/ws/2"
cover_art_endpoint = "https://coverartarchive.org"
lyrics_endpoint = "https://lrclib.net/api"
listenbrainz_endpoint = "https://api.listenbrainz.org"
http_timeout_seconds = 30
source_timeout_seconds = 60
download_timeout_seconds = 600
probe_timeout_seconds = 30
remux_timeout_seconds = 120
fingerprint_timeout_seconds = 60
phase_item_limit = 100
fingerprint_audio_seconds = 120
